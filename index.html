olid var(--line);background:#fff;border-radius:6px;padding:8px 9px;font-size:11px;color:var(--ink)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:600;color:#566b60}.field input,.field select{min-width:0;width:100%;padding:10px;border:1px solid #dfe7df;border-radius:6px;background:#fff;color:var(--ink);font-size:12px}.field input:focus,.field select:focus{outline:2px solid #b6d5c0;border-color:var(--green)}.field small{font-size:10px;color:#89958e}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.form-note{font-size:10px;color:#89958e;line-height:1.5;margin-top:12px}.notice{border-radius:7px;background:#eff5ef;color:#426b50;padding:10px 12px;font-size:11px;line-height:1.5;margin-bottom:14px}.notice.warn{background:#fff5df;color:#805d22}.price-preview{padding:10px;background:#f5f8f3;border-radius:6px;font-size:11px;color:#65786b}.summary-strip{display:flex;gap:22px;flex-wrap:wrap;padding:12px 17px;background:#f8faf7;border-bottom:1px solid var(--line);font-size:11px;color:#7a8980}.summary-strip strong{color:var(--ink);font-weight:600}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.product-card h3{font-size:12px;margin:0 0 4px}.product-card p{font-size:10px;color:#89958e;margin:0}.product-price{text-align:right;font-size:11px;font-weight:600}.product-price small{display:block;color:#89958e;font-weight:400;margin-top:4px}.report-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 18px;border-top:1px solid var(--line)}.report-total span{display:block;color:#89958e;font-size:10px;margin-bottom:6px}.report-total strong{font:18px Georgia,serif;font-weight:400}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;background:#173b32;color:white;padding:12px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:12px;z-index:10;animation:rise .2s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .shell.auth-pending{visibility:hidden}.shell.logged-out{display:block}.shell.logged-out aside,.shell.logged-out .topbar{display:none}.shell.logged-out .content{max-width:510px;margin:7vh auto;padding:20px}.login-panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:27px;box-shadow:var(--shadow)}.login-panel h1{font:30px Georgia,serif;font-weight:400;margin:8px 0}.login-panel p{color:#77877e;font-size:12px;line-height:1.6}.login-panel form{display:grid;gap:13px;margin-top:22px}.login-error{color:#ad4b36;font-size:11px;min-height:16px}.user-name{font-size:12px;font-weight:600}.logout-btn{padding:8px 10px}.auth-message{padding:12px;background:#fff5df;color:#805d22;border-radius:6px;font-size:12px;margin-top:14px}.reports-as-partner .notice,.reports-as-partner .report-totals{display:none}.reports-as-partner .data-table th:nth-child(n+6),.reports-as-partner .data-table td:nth-child(n+6){display:none}.products-as-partner .data-table th:nth-child(4),.products-as-partner .data-table td:nth-child(4),.products-as-partner .data-table th:nth-child(5),.products-as-partner .data-table td:nth-child(5),.products-as-partner .data-table th:nth-child(7),.products-as-partner .data-table td:nth-child(7),.products-as-partner .data-table th:nth-child(8),.products-as-partner .data-table td:nth-child(8){display:none}
    .product-id{display:none}.settlement-notice{font-size:14px;font-weight:600}.reports-as-partner .notice.settlement-notice{display:block}.settlement-amount{font:24px Georgia,serif;color:var(--green);margin-top:4px}.reports-as-partner .settlement-table th:nth-child(n+6),.reports-as-partner .settlement-table td:nth-child(n+6){display:table-cell}
    @media(max-width:1000px){.shell{grid-template-columns:205px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-main{grid-template-columns:1fr}.content{padding-top:24px}}
    @media(max-width:680px){.shell{display:block}aside{padding:12px 14px;display:block;position:sticky;top:0;z-index:5}.brand{padding:0;display:flex;align-items:center;gap:10px}.brand-mark{margin:0;width:34px;height:34px}.brand-name{font-size:20px}.brand-sub{font-size:8px}.nav-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;margin-top:12px;gap:5px}.nav button{white-space:nowrap;padding:8px 10px;font-size:11px}.nav-icon{display:none}.topbar{height:58px;padding:0 17px}.date-label{display:none}.role-select{max-width:145px;padding:8px 24px 8px 8px}.content{padding:24px 15px 40px}.page-heading{align-items:flex-start;flex-direction:column;margin-bottom:17px}.page-heading h1{font-size:29px}.page-heading .btn{align-self:stretch;justify-content:center}.stats{gap:9px}.stat{padding:14px;min-height:100px}.stat-value{font-size:21px}.stat-label{font-size:10px}.stat-foot{font-size:9px}.panel-head{padding:14px}.panel-body{padding:13px}.data-table td{padding:10px 8px}.data-table th{padding:9px 8px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.product-grid{grid-template-columns:1fr}.report-totals{gap:6px;padding:13px}.report-total strong{font-size:15px}.filters{width:100%}.filters select,.filters input{flex:1;min-width:105px}}

<body>
  <div class="shell auth-pending" id="shell">
    <aside>
      <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Primadona</div><div class="brand-sub">Sistem Konsinyasi</div></div></div>
      <div><div class="nav-label">Workspace</div><nav class="nav" id="navigation">
        <button data-page="dashboard" class="active"><span class="nav-icon">⌂</span>Ringkasan</button>
        <button data-page="stock"><span class="nav-icon">▤</span>Stok & Transaksi</button>
        <button data-page="reports"><span class="nav-icon">▥</span>Laporan</button>
        <button data-page="products"><span class="nav-icon">◈</span>Data Produk</button>
      </nav></div>
      <div class="side-bottom"><strong>Kedai Primadona</strong>Kelola titipan harian dengan rapi.<br>PRIMASIS · v1.0</div>
    </aside>
    <main>
      <header class="topbar"><div class="crumb">Kedai Primadona <span aria-hidden="true">/</span> <strong id="crumbPage">Ringkasan</strong></div><div class="top-actions"><div class="date-label" id="todayLabel"></div><span id="userName" class="user-name"></span><div id="avatar" class="avatar"></div><button id="logoutButton" class="btn btn-line logout-btn" type="button">Keluar</button></div></header>
      <div class="content" id="app"></div>
    </main>
  </div>
  <script>
    const PRODUCTS = [
      {id:'p-001',name:'Risoles',variant:'Mayo, Ayam, Pizzarella',unit:'PCS',cost:1800,supplier:2600,retail:3000},
      {id:'p-002',name:'Wonton Rebus Chili Oil',variant:'Level 1, Level 2',unit:'Porsi',cost:3000,supplier:4500,retail:5000},
      {id:'p-003',name:'Pangsit Goreng Chili Oil',variant:'',unit:'Porsi',cost:3000,supplier:4500,retail:5000},
      {id:'p-004',name:'Basreng Chili Oil',variant:'',unit:'Porsi',cost:3000,supplier:4500,retail:5000},
      {id:'p-005',name:'Mie Chili Oil',variant:'',unit:'Porsi',cost:3000,supplier:4500,retail:5000},
      {id:'p-006',name:'Mix Pangsit-Basreng Chili Oil',variant:'',unit:'Porsi',cost:3000,supplier:4500,retail:5000},
      {id:'p-007',name:'Kebab Sosis-Sayur',variant:'',unit:'PCS',cost:3000,supplier:4500,retail:5000},
      {id:'p-008',name:'Brownies Potong',variant:'Original',unit:'PCS',cost:1200,supplier:1750,retail:2000}
    ];
    const PARTNERS = {smkmuh4:'SMK Muhammadiyah 4',smanmojo:'SMAN Mojo'};
    const today=()=>new Date().toLocaleDateString('sv-SE');
    let state={products:[],deliveries:[],sales:[],returns:[]};let user=null;let role=null;let csrfToken='';let page='dashboard';let editingProduct=null;let editingDelivery=null;
    async function api(path,options={}){const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(options.method&&options.method!=='GET'?{'X-CSRF-Token':csrfToken}:{}),...options.headers};const response=await fetch(`/api${path}`,{credentials:'same-origin',...options,headers});const result=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(result.error||'Permintaan gagal.');error.status=response.status;throw error}return result}
    async function refreshState(){state=await api('/state')}
    function showLogin(message=''){const shell=document.getElementById('shell');shell.classList.add('logged-out');shell.classList.remove('auth-pending');document.getElementById('app').innerHTML=`<section class="login-panel"><div class="brand-mark">P</div><div class="eyebrow">KEDAI PRIMADONA</div><h1>Masuk ke PRIMASIS</h1><p>Masuk menggunakan akun admin atau koperasi yang telah disiapkan.</p><div class="form-note">Setup pertama: jalankan <code>.venv/bin/python app.py setup-users</code> di terminal untuk membuat tiga akun.</div><form id="loginForm"><div class="field"><label for="loginUsername">Nama pengguna</label><input id="loginUsername" autocomplete="username" required></div><div class="field"><label for="loginPassword">Kata sandi</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><div id="loginError" class="login-error">${escapeHtml(message)}</div><button class="btn btn-primary" type="submit">Masuk</button></form>${message.includes('server')?'<div class="auth-message">Server PRIMASIS belum terhubung. Jalankan <code>python app.py</code> lalu muat ulang halaman.</div>':''}</section>`;document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;try{const result=await api('/session/login',{method:'POST',body:JSON.stringify({username:document.getElementById('loginUsername').value,password:document.getElementById('loginPassword').value})});user=result.user;role=user.role;csrfToken=result.csrfToken;await refreshState();showApp()}catch(error){document.getElementById('loginError').textContent=error.message;button.disabled=false}})}
    function showSetup(message=''){const shell=document.getElementById('shell');shell.classList.add('logged-out');shell.classList.remove('auth-pending');document.getElementById('app').innerHTML=`<section class="login-panel"><div class="brand-mark">P</div><div class="eyebrow">PENYIAPAN PERTAMA</div><h1>Buat akun PRIMASIS</h1><p>Tetapkan kata sandi setiap akun. Password dikirim ke server untuk disimpan dalam bentuk hash.</p><form id="setupForm"><div class="field"><label for="setupAdmin">Chusnul · Admin</label><input id="setupAdmin" type="password" minlength="10" autocomplete="new-password" placeholder="Kata sandi, minimal 10 karakter" required><input id="setupAdminRepeat" type="password" minlength="10" autocomplete="new-password" placeholder="Ulangi kata sandi" required></div><div class="field"><label for="setupSmk">SMK Muhammadiyah 4</label><input id="setupSmk" type="password" minlength="10" autocomplete="new-password" placeholder="Kata sandi, minimal 10 karakter" required><input id="setupSmkRepeat" type="password" minlength="10" autocomplete="new-password" placeholder="Ulangi kata sandi" required></div><div class="field"><label for="setupSman">SMAN Mojo</label><input id="setupSman" type="password" minlength="10" autocomplete="new-password" placeholder="Kata sandi, minimal 10 karakter" required><input id="setupSmanRepeat" type="password" minlength="10" autocomplete="new-password" placeholder="Ulangi kata sandi" required></div><div id="setupError" class="login-error">${escapeHtml(message)}</div><button class="btn btn-primary" type="submit">Buat akun dan masuk</button></form></section>`;document.getElementById('setupForm').addEventListener('submit',async event=>{event.preventDefault();const values={adminPassword:document.getElementById('setupAdmin').value,smkmuh4Password:document.getElementById('setupSmk').value,smanmojoPassword:document.getElementById('setupSman').value};if(values.adminPassword!==document.getElementById('setupAdminRepeat').value||values.smkmuh4Password!==document.getElementById('setupSmkRepeat').value||values.smanmojoPassword!==document.getElementById('setupSmanRepeat').value){document.getElementById('setupError').textContent='Konfirmasi kata sandi belum cocok.';return}const button=event.currentTarget.querySelector('button');button.disabled=true;try{const result=await api('/setup',{method:'POST',body:JSON.stringify(values)});user=result.user;role=user.role;csrfToken=result.csrfToken;await refreshState();showApp()}catch(error){document.getElementById('setupError').textContent=error.message;button.disabled=false}})}
    function showApp(){const shell=document.getElementById('shell');shell.classList.remove('logged-out','auth-pending');document.getElementById('userName').textContent=user.display_name;document.getElementById('avatar').textContent=role==='admin'?'CH':role==='smkmuh4'?'M4':'SM';document.querySelectorAll('.nav button[data-page="stock"],.nav button[data-page="reports"],.nav button[data-page="products"]').forEach(button=>button.classList.toggle('hidden',role!=='admin'&&button.dataset.page==='products'));document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});render()}
    async function boot(){try{const result=await api('/session');csrfToken=result.csrfToken;const setup=await api('/setup-status');if(!setup.configured){showSetup();return}user=result.user;if(user){role=user.role;await refreshState();showApp()}else showLogin()}catch(error){showLogin('Server PRIMASIS belum terhubung.')}}
    const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
    const product=id=>state.products.find(p=>p.id===id);
    const canSee=d=>role==='admin'||d.partner===role;
    const visibleDeliveries=()=>state.deliveries.filter(canSee);
    const deliveredQty=d=>Number(d.qty)||0;
    const soldQty=d=>state.sales.filter(s=>s.deliveryId===d.id).reduce((a,s)=>a+Number(s.qty),0);
    const returnedQty=d=>state.returns.filter(r=>r.deliveryId===d.id).reduce((a,r)=>a+Number(r.qty),0);
    const remainingQty=d=>Math.max(0,deliveredQty(d)-soldQty(d)-returnedQty(d));
    const allSalesFor=d=>state.sales.filter(s=>s.deliveryId===d.id).reduce((a,s)=>a+Number(s.qty),0);
    const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const formatDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
    function toast(message){const old=document.querySelector('.toast');if(old)old.remove();const node=document.createElement('div');node.className='toast';node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),2600)}
    async function setPage(next){page=next;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumbPage').textContent={dashboard:'Ringkasan',stock:'Stok & Transaksi',reports:'Laporan',products:'Data Produk'}[page];try{await refreshState();render()}catch(error){if(error.status===401){user=null;showLogin('Sesi telah berakhir. Silakan masuk kembali.')}else toast(error.message)}}
    function render(){if(!user)return showLogin();const app=document.getElementById('app');app.classList.toggle('reports-as-partner',page==='reports'&&role!=='admin');app.classList.toggle('products-as-partner',page==='products'&&role!=='admin');if(page==='dashboard')renderDashboard();if(page==='stock')renderStock();if(page==='reports')renderReports();if(page==='products')renderProducts()}
    function heading(kicker,title,subtitle,action=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
    function stat(label,value,foot){return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
    function productLabel(id){const p=product(id);return p?`${p.name}${p.variant?` · ${p.variant}`:''}`:id}
    function renderDashboard(){

        `<div class="stats">${stat('Produk dititipkan',ds.reduce((a,d)=>a+deliveredQty(d),0),`${ds.length} catatan titipan`)}${stat('Produk terjual',sold,`Omzet mitra ${money(gross)}`)}${stat('Stok tersisa',remain,'Masih berada di koperasi')}${stat('Produk diretur',returns,'Dikembalikan ke suplier')}</div>
        <div class="layout-main"><section class="panel"><div class="panel-head"><div><h2>Pergerakan terbaru</h2><p>Titipan, penjualan, dan retur produk</p></div><button class="btn btn-quiet btn-small" onclick="setPage('stock')">Lihat semua →</button></div><div class="table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>Tanggal</th><th>Produk</th><th>Mitra</th><th>Masuk</th><th>Terjual</th><th>Sisa</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${formatDate(d.date)}</td><td><div class="product-cell"><div class="product-dot">${product(d.productId)?.name?.slice(0,1)||'P'}</div><div><div class="product-name">${escapeHtml(productLabel(d.productId))}</div><div class="product-id">${d.productId}</div></div></div></td><td>${PARTNERS[d.partner]}</td><td>${deliveredQty(d)}</td><td>${soldQty(d)}</td><td><span class="pill ${remainingQty(d)?'orange':'gray'}">${remainingQty(d)}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty"><b>Belum ada pergerakan</b>Catat titipan harian untuk mulai melacak stok.</div>'}</div></section>
        <section class="panel"><div class="panel-head"><div><h2>Ringkasan mitra</h2><p>Stok aktif di tiap koperasi</p></div></div><div class="panel-body"><div class="partner-list">${partners.map(k=>{const mine=state.deliveries.filter(d=>d.partner===k);const stock=mine.reduce((a,d)=>a+remainingQty(d),0);const soldHere=mine.reduce((a,d)=>a+soldQty(d),0);return `<div class="partner-row"><div class="partner-symbol">${k==='smkmuh4'?'M4':'SM'}</div><div><div class="partner-name">${PARTNERS[k]}</div><div class="partner-detail">${soldHere} produk terjual</div></div><div class="partner-count">${stock}<small>stok sisa</small></div></div>`}).join('')}</div></div></section></div>`;
    }
    function renderStock(){const ds=visibleDeliveries().slice().sort((a,b)=>b.date.localeCompare(a.date));
      document.getElementById('app').innerHTML=heading('OPERASIONAL HARIAN','Stok & Transaksi',role==='admin'?'Catat produk yang dititipkan, penjualan, dan pengembalian.':'Input penjualan dan retur untuk stok koperasi Anda.')+
      `<div class="layout-main"><div>${role==='admin'?`<section class="panel" id="deliveryForm"><div class="panel-head"><div><h2>${editingDelivery?'Ubah titipan':'Catat titipan baru'}</h2><p>Stok masuk ke koperasi pada tanggal tertentu</p></div></div><div class="panel-body"><form id="deliveryFormEl"><div class="form-grid"><div class="field"><label for="deliveryDate">Tanggal titip</label><input id="deliveryDate" type="date" value="${editingDelivery?.date||today()}" required></div><div class="field"><label for="deliveryPartner">Mitra koperasi</label><select id="deliveryPartner" required>${Object.entries(PARTNERS).map(([k,v])=>`<option value="${k}" ${editingDelivery?.partner===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label for="deliveryProduct">Produk</label><select id="deliveryProduct" required>${state.products.map(p=>`<option value="${p.id}" ${editingDelivery?.productId===p.id?'selected':''}>${p.id} · ${p.name} ${p.variant?`(${p.variant})`:''} · ${money(p.supplier)}</option>`).join('')}</select></div><div class="field"><label for="deliveryQty">Jumlah dititipkan</label><input id="deliveryQty" type="number" min="1" step="1" value="${editingDelivery?.qty||''}" placeholder="0" required></div><div class="field"><label>Harga jual suplier</label><div class="price-preview" id="supplierPrice"></div></div></div><div class="form-actions"><button type="button" class="btn btn-line ${editingDelivery?'':'hidden'}" onclick="cancelDeliveryEdit()">Batal</button><button class="btn btn-primary" type="submit">${editingDelivery?'Simpan perubahan':'Simpan titipan'}</button></div></form></div></section>`:''}
      <section class="panel ${role==='admin'?'section-gap':''}"><div class="panel-head"><div><h2>Daftar stok konsinyasi</h2><p>Saldo tersisa dihitung dari titipan dikurangi penjualan dan retur</p></div></div><div class="summary-strip"><span>Masuk <strong>${ds.reduce((a,d)=>a+deliveredQty(d),0)}</strong></span><span>Terjual <strong>${ds.reduce((a,d)=>a+soldQty(d),0)}</strong></span><span>Retur <strong>${ds.reduce((a,d)=>a+returnedQty(d),0)}</strong></span><span>Sisa <strong>${ds.reduce((a,d)=>a+remainingQty(d),0)}</strong></span></div><div class="table-wrap">${ds.length?`<table class="data-table"><thead><tr><th>Tanggal masuk</th>${role==='admin'?'<th>Mitra</th>':''}<th>Produk</th><th>Masuk</th><th>Terjual</th><th>Retur</th><th>Sisa</th>${role==='admin'?'<th></th>':''}</tr></thead><tbody>${ds.map(d=>`<tr><td>${formatDate(d.date)}</td>${role==='admin'?`<td>${PARTNERS[d.partner]}</td>`:''}<td><div class="product-name">${escapeHtml(productLabel(d.productId))}</div><div class="product-id">${d.productId} · ${money(product(d.productId)?.supplier)}/unit</div></td><td>${deliveredQty(d)}</td><td>${soldQty(d)}</td><td>${returnedQty(d)}</td><td><span class="pill ${remainingQty(d)?'orange':'gray'}">${remainingQty(d)}</span></td>${role==='admin'?`<td><button class="btn btn-line btn-small" onclick="editDelivery('${d.id}')">Edit</button></td>`:''}</tr>`).join('')}</tbody></table>`:`<div class="empty"><b>Belum ada stok tercatat</b>${role==='admin'?'Gunakan formulir di atas untuk mencatat titipan pertama.':'Minta admin mencatat titipan untuk koperasi Anda.'}</div>`}</div></section></div>
      <div><section class="panel"><div class="panel-head"><div><h2>Input penjualan</h2><p>Penjualan akan mengurangi stok tersedia</p></div></div><div class="panel-body"><form id="saleForm"><div class="form-grid"><div class="field full"><label for="saleDate">Tanggal penjualan</label><input type="date" id="saleDate" value="${today()}" required></div><div class="field full"><label for="saleDelivery">Produk / titipan</label><select id="saleDelivery" required><option value="">Pilih stok tersedia</option>${ds.filter(d=>remainingQty(d)>0).map(d=>`<option value="${d.id}">${formatDate(d.date)} · ${productLabel(d.productId)} (sisa ${remainingQty(d)})</option>`).join('')}</select></div><div class="field full"><label for="saleQty">Jumlah terjual</label><input type="number" id="saleQty" min="1" step="1" placeholder="0" required></div><div class="field full"><label>Omzet penjualan</label><div class="price-preview" id="salePreview">Pilih produk untuk melihat nilai penjualan.</div></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan penjualan</button></div></form></div></section>
      <section class="panel section-gap"><div class="panel-head"><div><h2>Pengembalian sore</h2><p>Catat stok yang dikembalikan ke suplier</p></div></div><div class="panel-body"><form id="returnForm"><div class="form-grid"><div class="field"><label for="returnDate">Tanggal kembali</label><input type="date" id="returnDate" value="${today()}" required></div><div class="field"><label for="returnDelivery">Tanggal & produk masuk</label><select id="returnDelivery" required><option value="">Pilih stok</option>${ds.filter(d=>remainingQty(d)>0).map(d=>`<option value="${d.id}">${formatDate(d.date)} · ${productLabel(d.productId)} (sisa ${remainingQty(d)})</option>`).join('')}</select></div><div class="field full"><label for="returnQty">Jumlah dikembalikan</label><input type="number" id="returnQty" min="1" step="1" placeholder="0" required></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan retur</button></div></form><div class="form-note">Jumlah retur tidak boleh melebihi stok yang belum terjual.</div></div></section></div></div>`;
      bindStockForms();
      if(editingDelivery){document.getElementById('deliveryPartner').disabled=true;document.getElementById('deliveryProduct').disabled=true}
      if(role==='admin')document.getElementById('saleForm').closest('.layout-main > div').classList.add('hidden');
    }
    function bindStockForms(){
      const form=document.getElementById('deliveryFormEl');if(form){const refresh=()=>{document.getElementById('supplierPrice').textContent=money(product(document.getElementById('deliveryProduct').value)?.supplier)+' per unit'};refresh();document.getElementById('deliveryProduct').addEventListener('change',refresh);form.addEventListener('submit',async e=>{e.preventDefault();const entry={date:document.getElementById('deliveryDate').value,partner:document.getElementById('deliveryPartner').value,productId:document.getElementById('deliveryProduct').value,qty:Number(document.getElementById('deliveryQty').value)};try{if(editingDelivery){await api(`/deliveries/${editingDelivery}`,{method:'PUT',body:JSON.stringify(entry)});editingDelivery=null;toast('Titipan berhasil diperbarui.')}else{await api('/deliveries',{method:'POST',body:JSON.stringify(entry)});toast('Titipan berhasil dicatat.')}await refreshState();renderStock()}catch(error){toast(error.message)}})}
      const saleForm=document.getElementById('saleForm');const deliverySelect=document.getElementById('saleDelivery');const qtyInput=document.getElementById('saleQty');const salePreview=document.getElementById('salePreview');const updateSale=()=>{const d=state.deliveries.find(x=>String(x.id)===deliverySelect.value);const qty=Number(qtyInput.value||0);if(!d){salePreview.textContent='Pilih produk untuk melihat nilai penjualan.';qtyInput.removeAttribute('max');return}const p=product(d.productId);qtyInput.max=remainingQty(d);salePreview.textContent=`${money(qty*(d.unitRetail??p.retail))} · ${money(d.unitRetail??p.retail)} per ${p.unit} · tersedia ${remainingQty(d)}`};deliverySelect.addEventListener('change',updateSale);qtyInput.addEventListener('input',updateSale);saleForm.addEventListener('submit',async e=>{e.preventDefault();const d=state.deliveries.find(x=>String(x.id)===deliverySelect.value);const qty=Number(qtyInput.value);if(!d||qty<1||qty>remainingQty(d)){toast('Jumlah penjualan melebihi stok yang tersedia.');return}try{await api('/sales',{method:'POST',body:JSON.stringify({deliveryId:d.id,date:document.getElementById('saleDate').value,qty})});await refreshState();toast('Penjualan berhasil disimpan.');renderStock()}catch(error){toast(error.message)}});
      document.getElementById('returnForm').addEventListener('submit',async e=>{e.preventDefault();const d=state.deliveries.find(x=>String(x.id)===document.getElementById('returnDelivery').value);const qty=Number(document.getElementById('returnQty').value);if(!d||qty<1||qty>remainingQty(d)){toast('Jumlah retur melebihi stok tersisa.');return}try{await api('/returns',{method:'POST',body:JSON.stringify({deliveryId:d.id,date:document.getElementById('returnDate').value,qty})});await refreshState();toast('Pengembalian berhasil dicatat.');renderStock()}catch(error){toast(error.message)}});
    }
    function editDelivery(id){editingDelivery=Number(id);setPage('stock');setTimeout(()=>document.getElementById('deliveryForm')?.scrollIntoView({behavior:'smooth'}),20)}
    function cancelDeliveryEdit(){editingDelivery=null;renderStock()}
    function reportData(){const ds=visibleDeliveries();return state.products.map(p=>{const related=ds.filter(d=>d.productId===p.id);const delivered=related.reduce((a,d)=>a+deliveredQty(d),0);const sold=related.reduce((a,d)=>a+soldQty(d),0);const returned=related.reduce((a,d)=>a+returnedQty(d),0);const remaining=related.reduce((a,d)=>a+remainingQty(d),0);const supplierRevenue=role==='admin'?related.reduce((a,d)=>a+soldQty(d)*(d.unitSupplier??p.supplier),0):0;const supplierCost=role==='admin'?related.reduce((a,d)=>a+soldQty(d)*(d.unitCost??p.cost),0):0;const partnerProfit=role==='admin'?related.reduce((a,d)=>a+soldQty(d)*((d.unitRetail??p.retail)-(d.unitSupplier??p.supplier)),0):0;const retailRevenue=role==='admin'?related.reduce((a,d)=>a+soldQty(d)*(d.unitRetail??p.retail),0):0;return{p,delivered,sold,returned,remaining,supplierRevenue,supplierCost,supplierProfit:supplierRevenue-supplierCost,partnerProfit,retailRevenue}}).filter(x=>x.delivered||x.sold||x.returned)}
    function partnerReportData(){return Object.entries(PARTNERS).map(([partner,name])=>{const deliveries=state.deliveries.filter(d=>d.partner===partner);return{name,sold:deliveries.reduce((a,d)=>a+soldQty(d),0),supplierProfit:deliveries.reduce((a,d)=>a+soldQty(d)*((d.unitSupplier??product(d.productId).supplier)-(d.unitCost??product(d.productId).cost)),0),partnerProfit:deliveries.reduce((a,d)=>a+soldQty(d)*((d.unitRetail??product(d.productId).retail)-(d.unitSupplier??product(d.productId).supplier)),0),revenue:deliveries.reduce((a,d)=>a+soldQty(d)*(d.unitRetail??product(d.productId).retail),0)}})}
    function renderReports(){document.getElementById('app').classList.toggle('reports-as-partner',role!=='admin');const data=reportData();const totals=data.reduce((a,r)=>{for(const k of ['delivered','sold','returned','remaining','supplierRevenue','supplierCost','supplierProfit','partnerProfit','retailRevenue'])a[k]+=r[k];return a},{delivered:0,sold:0,returned:0,remaining:0,supplierRevenue:0,supplierCost:0,supplierProfit:0,partnerProfit:0,retailRevenue:0});
      document.getElementById('app').innerHTML=heading('REKAP & KEUANGAN','Laporan konsinyasi',role==='admin'?'Rekap stok dan margin terealisasi dari seluruh mitra.':`Rekap stok dan margin khusus ${PARTNERS[role]}.`)+
      `<div class="notice">Perhitungan laba memakai produk yang <strong>terjual</strong>. Laba suplier = (harga suplier − modal) × terjual. Laba mitra = (harga jual mitra − harga suplier) × terjual. Produk yang belum terjual tetap tercatat sebagai stok.</div><section class="panel"><div class="panel-head"><div><h2>Ringkasan periode</h2><p>Akumulasi seluruh data tersimpan</p></div><button class="btn btn-line btn-small" onclick="exportReport()">↓ Ekspor CSV</button></div><div class="summary-strip"><span>Masuk <strong>${totals.delivered}</strong></span><span>Terjual <strong>${totals.sold}</strong></span><span>Retur <strong>${totals.returned}</strong></span><span>Sisa <strong>${totals.remaining}</strong></span></div><div class="report-totals"><div class="report-total"><span>Omzet penjualan</span><strong>${money(totals.retailRevenue)}</strong></div><div class="report-total"><span>Laba suplier</span><strong>${money(totals.supplierProfit)}</strong></div><div class="report-total"><span>Laba koperasi</span><strong>${money(totals.partnerProfit)}</strong></div></div><div class="table-wrap">${data.length?`<table class="data-table"><thead><tr><th>Produk</th><th>Masuk</th><th>Terjual</th><th>Retur</th><th>Sisa</th><th>Modal suplier</th><th>Penjualan suplier</th><th>Laba suplier</th><th>Laba mitra</th></tr></thead><tbody>${data.map(r=>`<tr><td><div class="product-name">${escapeHtml(productLabel(r.p.id))}</div><div class="product-id">${r.p.id}</div></td><td>${r.delivered}</td><td>${r.sold}</td><td>${r.returned}</td><td>${r.remaining}</td><td>${money(r.supplierCost)}</td><td>${money(r.supplierRevenue)}</td><td>${money(r.supplierProfit)}</td><td>${money(r.partnerProfit)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty"><b>Belum ada data laporan</b>Rekap muncul setelah titipan dan penjualan dicatat.</div>'}</div></section>`;
      if(role==='admin')document.getElementById('app').innerHTML+=`<section class="panel section-gap"><div class="panel-head"><div><h2>Keuntungan per mitra</h2><p>Perhitungan berdasarkan produk terjual</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Mitra</th><th>Terjual</th><th>Omzet mitra</th><th>Laba suplier</th><th>Laba koperasi</th></tr></thead><tbody>${partnerReportData().map(r=>`<tr><td>${r.name}</td><td>${r.sold}</td><td>${money(r.revenue)}</td><td>${money(r.supplierProfit)}</td><td>${money(r.partnerProfit)}</td></tr>`).join('')}</tbody></table></div></section>`;
    }
    function exportReport(){const columns=role==='admin'?['id_produk','nama_produk','jumlah_masuk','terjual','retur','sisa','modal_suplier','penjualan_suplier','laba_suplier','laba_mitra']:['id_produk','nama_produk','jumlah_masuk','terjual','retur','sisa'];const rows=[columns,...reportData().map(r=>role==='admin'?[r.p.id,r.p.name,r.delivered,r.sold,r.returned,r.remaining,r.supplierCost,r.supplierRevenue,r.supplierProfit,r.partnerProfit]:[r.p.id,r.p.name,r.delivered,r.sold,r.returned,r.remaining])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download=`laporan-primasis-${today()}.csv`;link.click();URL.revokeObjectURL(link.href)}
    function renderProducts(){document.getElementById('app').classList.toggle('products-as-partner',role!=='admin');document.getElementById('app').innerHTML=heading('KATALOG','Data Produk',role==='admin'?'Daftar harga dasar produk Kedai Primadona. Harga ini dipakai untuk laporan margin.':'Katalog dan harga jual produk untuk koperasi.',role==='admin'?'<button class="btn btn-primary" onclick="openProductForm()">＋ Tambah produk</button>':'')+
      `<section class="panel"><div class="panel-head"><div><h2>Katalog aktif</h2><p>${state.products.length} produk · harga dalam rupiah</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Produk</th><th>Varian</th><th>Satuan</th><th>Modal suplier</th><th>Jual suplier</th><th>Jual mitra</th><th>Margin suplier</th><th>Margin mitra</th>${role==='admin'?'<th></th>':''}</tr></thead><tbody>${state.products.map(p=>`<tr><td><div class="product-cell"><div class="product-dot">${p.name.slice(0,1)}</div><div><div class="product-name">${escapeHtml(p.name)}</div><div class="product-id">${p.id}</div></div></div></td><td>${escapeHtml(p.variant||'-')}</td><td>${escapeHtml(p.unit)}</td><td>${money(p.cost)}</td><td>${money(p.supplier)}</td><td>${money(p.retail)}</td><td>${money(p.supplier-p.cost)}</td><td>${money(p.retail-p.supplier)}</td>${role==='admin'?`<td><button class="btn btn-line btn-small" onclick="openProductForm('${p.id}')">Edit</button></td>`:''}</tr>`).join('')}</tbody></table></div></section>${role==='admin'?`<section class="panel section-gap"><div class="panel-head"><div><h2>Tambah / ubah produk</h2><p>Perubahan harga akan digunakan untuk perhitungan laporan.</p></div></div><div class="panel-body"><form id="productForm"><div class="form-grid"><div class="field"><label for="pId">ID produk</label><input id="pId" required placeholder="p-009" ${editingProduct?'readonly':''}></div><div class="field"><label for="pName">Nama produk</label><input id="pName" required></div><div class="field"><label for="pVariant">Kategori / varian</label><input id="pVariant" placeholder="Contoh: Original"></div><div class="field"><label for="pUnit">Satuan</label><input id="pUnit" required placeholder="PCS / Porsi"></div><div class="field"><label for="pCost">Modal suplier (Rp)</label><input id="pCost" type="number" min="0" required></div><div class="field"><label for="pSupplier">Harga jual suplier (Rp)</label><input id="pSupplier" type="number" min="0" required></div><div class="field"><label for="pRetail">Harga jual mitra (Rp)</label><input id="pRetail" type="number" min="0" required></div></div><div class="form-actions"><button type="button" class="btn btn-line ${editingProduct?'':'hidden'}" onclick="cancelProductEdit()">Batal</button><button type="submit" class="btn btn-primary">${editingProduct?'Simpan perubahan':'Tambah produk'}</button></div></form></div></section>`:''}`;
      if(role==='admin')bindProductForm();
    }
    function openProductForm(id){editingProduct=id||null;renderProducts();if(id){const p=product(id);for(const [field,key] of [['pId','id'],['pName','name'],['pVariant','variant'],['pUnit','unit'],['pCost','cost'],['pSupplier','supplier'],['pRetail','retail']])document.getElementById(field).value=p[key]??'';document.getElementById('productForm').scrollIntoView({behavior:'smooth'})}}
    function cancelProductEdit(){editingProduct=null;renderProducts()}
    function bindProductForm(){document.getElementById('productForm').addEventListener('submit',async e=>{e.preventDefault();const p={id:document.getElementById('pId').value.trim().toLowerCase(),name:document.getElementById('pName').value.trim(),variant:document.getElementById('pVariant').value.trim(),unit:document.getElementById('pUnit').value.trim(),cost:Number(document.getElementById('pCost').value),supplier:Number(document.getElementById('pSupplier').value),retail:Number(document.getElementById('pRetail').value)};try{if(editingProduct){await api(`/products/${editingProduct}`,{method:'PUT',body:JSON.stringify(p)});editingProduct=null;toast('Produk berhasil diperbarui.')}else{await api('/products',{method:'POST',body:JSON.stringify(p)});toast('Produk berhasil ditambahkan.')}await refreshState();renderProducts()}catch(error){toast(error.message)}})}
    document.getElementById('navigation').addEventListener('click',e=>{const button=e.target.closest('button[data-page]');if(button&&!button.classList.contains('hidden'))setPage(button.dataset.page)});
    document.getElementById('logoutButton').addEventListener('click',async()=>{try{const result=await api('/session/logout',{method:'POST'});csrfToken=result.csrfToken;user=null;role=null;state={products:[],deliveries:[],sales:[],returns:[]};page='dashboard';showLogin()}catch(error){toast(error.message)}});
    boot();
    async function refreshState(){state=await api('/state');Object.assign(PARTNERS,Object.fromEntries(Object.entries(state.partners||{}).map(([id,name])=>[id,escapeHtml(name)])))}
    async function setPage(next){page=next;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.page===page));document.getElementById('crumbPage').textContent={dashboard:'Ringkasan',stock:'Stok & Transaksi',reports:'Laporan',products:'Data Produk',partners:'Mitra'}[page]||'Ringkasan';try{await refreshState();render()}catch(error){if(error.status===401){user=null;showLogin('Sesi telah berakhir. Silakan masuk kembali.')}else toast(error.message)}}
    function render(){if(!user)return showLogin();const partnerButton=document.querySelector('.nav button[data-page="partners"]');if(partnerButton)partnerButton.classList.toggle('hidden',role!=='admin');const app=document.getElementById('app');app.classList.toggle('reports-as-partner',page==='reports'&&role!=='admin');app.classList.toggle('products-as-partner',page==='products'&&role!=='admin');if(page==='dashboard')renderDashboard();else if(page==='stock')renderStock();else if(page==='reports')renderReports();else if(page==='products')renderProducts();else if(page==='partners'&&role==='admin')renderPartners();else{page='dashboard';renderDashboard()}}
    function renderStock(){const ds=visibleDeliveries().slice().sort((a,b)=>b.date.localeCompare(a.date));const open=ds.filter(d=>remainingQty(d)>0);const admin=role==='admin';document.getElementById('app').innerHTML=heading('OPERASIONAL HARIAN','Stok & Transaksi',admin?'Catat titipan dan pantau rekap sore dari setiap mitra.':'Input sisa sore; jumlah terjual dan setoran dihitung otomatis.')+
      `<div class="layout-main"><div>${admin?`<section class="panel" id="deliveryForm"><div class="panel-head"><div><h2>${editingDelivery?'Ubah titipan':'Catat titipan baru'}</h2><p>Stok masuk ke koperasi pada tanggal tertentu</p></div></div><div class="panel-body"><form id="deliveryFormEl"><div class="form-grid"><div class="field"><label for="deliveryDate">Tanggal titip</label><input id="deliveryDate" type="date" value="${editingDelivery?.date||today()}" required></div><div class="field"><label for="deliveryPartner">Mitra koperasi</label><select id="deliveryPartner" required>${Object.entries(PARTNERS).map(([id,name])=>`<option value="${id}" ${editingDelivery?.partner===id?'selected':''}>${name}</option>`).join('')}</select></div><div class="field full"><label for="deliveryProduct">Produk</label><select id="deliveryProduct" required>${state.products.map(p=>`<option value="${escapeHtml(p.id)}" ${editingDelivery?.productId===p.id?'selected':''}>${escapeHtml(productLabel(p.id))} · ${money(p.supplier)}</option>`).join('')}</select></div><div class="field"><label for="deliveryQty">Jumlah dititipkan</label><input id="deliveryQty" type="number" min="1" step="1" value="${editingDelivery?.qty||''}" placeholder="0" required></div><div class="field"><label>Harga setor per produk</label><div class="price-preview" id="supplierPrice"></div></div></div><div class="form-actions"><button type="button" class="btn btn-line ${editingDelivery?'':'hidden'}" onclick="cancelDeliveryEdit()">Batal</button><button class="btn btn-primary" type="submit">${editingDelivery?'Simpan perubahan':'Simpan titipan'}</button></div></form></div></section>`:''}
      <section class="panel ${admin?'section-gap':''}"><div class="panel-head"><div><h2>Daftar stok konsinyasi</h2><p>Penjualan dihitung dari jumlah masuk dikurangi retur/sisa sore</p></div></div><div class="summary-strip"><span>Masuk <strong>${ds.reduce((sum,d)=>sum+deliveredQty(d),0)}</strong></span><span>Terjual <strong>${ds.reduce((sum,d)=>sum+soldQty(d),0)}</strong></span><span>Retur <strong>${ds.reduce((sum,d)=>sum+returnedQty(d),0)}</strong></span><span>Sisa <strong>${ds.reduce((sum,d)=>sum+remainingQty(d),0)}</strong></span></div><div class="table-wrap">${ds.length?`<table class="data-table"><thead><tr><th>Tanggal masuk</th>${admin?'<th>Mitra</th>':''}<th>Produk</th><th>Masuk</th><th>Terjual</th><th>Retur</th><th>Sisa</th>${admin?'<th></th>':''}</tr></thead><tbody>${ds.map(d=>`<tr><td>${formatDate(d.date)}</td>${admin?`<td>${PARTNERS[d.partner]||escapeHtml(d.partner)}</td>`:''}<td><div class="product-name">${escapeHtml(productLabel(d.productId))}</div></td><td>${deliveredQty(d)}</td><td>${soldQty(d)}</td><td>${returnedQty(d)}</td><td><span class="pill ${remainingQty(d)?'orange':'gray'}">${remainingQty(d)}</span></td>${admin?`<td><button class="btn btn-line btn-small" onclick="editDelivery('${d.id}')">Edit</button></td>`:''}</tr>`).join('')}</tbody></table>`:'<div class="empty"><b>Belum ada stok tercatat</b>Minta admin mencatat titipan untuk koperasi Anda.</div>'}</div></section></div>
      ${admin?'':`<div><section class="panel"><div class="panel-head"><div><h2>Rekap penjualan & retur sore</h2><p>Masukkan sisa/retur; terjual dihitung otomatis</p></div></div><div class="panel-body"><form id="reconciliationForm"><div class="form-grid"><div class="field full"><label for="reconciliationDate">Tanggal rekap</label><input type="date" id="reconciliationDate" value="${today()}" required></div><div class="field full"><label for="reconciliationDelivery">Produk / titipan</label><select id="reconciliationDelivery" required><option value="">Pilih stok</option>${open.map(d=>`<option value="${d.id}">${formatDate(d.date)} · ${escapeHtml(productLabel(d.productId))} (stok ${remainingQty(d)})</option>`).join('')}</select></div><div class="field full"><label for="reconciliationQty">Jumlah retur / sisa yang dikembalikan</label><input type="number" id="reconciliationQty" min="0" step="1" placeholder="Masukkan jumlah sisa, misalnya 1" required><small>Contoh: titipan 20, sisa 1 → terjual otomatis 19.</small></div><div class="field full"><label>Jumlah terjual otomatis</label><div class="price-preview" id="reconciliationSold">Pilih stok dan masukkan jumlah sisa.</div></div><div class="field full"><label>Total uang yang harus diserahkan ke Kedai Primadona</label><div class="price-preview settlement-amount" id="reconciliationAmount">Rp 0</div></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan rekap sore</button></div></form></div></section></div>`}</div>`;
      if(admin){const form=document.getElementById('deliveryFormEl');const refreshPrice=()=>{document.getElementById('supplierPrice').textContent=money(product(document.getElementById('deliveryProduct').value)?.supplier)+' per unit'};refreshPrice();document.getElementById('deliveryProduct').addEventListener('change',refreshPrice);form.addEventListener('submit',async event=>{event.preventDefault();const entry={date:document.getElementById('deliveryDate').value,partner:document.getElementById('deliveryPartner').value,productId:document.getElementById('deliveryProduct').value,qty:Number(document.getElementById('deliveryQty').value)};try{if(editingDelivery){await api(`/deliveries/${editingDelivery}`,{method:'PUT',body:JSON.stringify(entry)});editingDelivery=null;toast('Titipan berhasil diperbarui.')}else{await api('/deliveries',{method:'POST',body:JSON.stringify(entry)});toast('Titipan berhasil dicatat.')}await refreshState();renderStock()}catch(error){toast(error.message)}});if(editingDelivery){document.getElementById('deliveryPartner').disabled=true;document.getElementById('deliveryProduct').disabled=true}return}
      const deliverySelect=document.getElementById('reconciliationDelivery');const qtyInput=document.getElementById('reconciliationQty');const updatePreview=()=>{const d=ds.find(item=>String(item.id)===deliverySelect.value);const raw=qtyInput.value;const entered=raw===''?null:Number(raw);const available=d?remainingQty(d):0;const valid=entered!==null&&Number.isInteger(entered)&&entered>=0&&entered<=available;const sold=valid?available-entered:0;const price=Number(d?.unitSupplier||0);document.getElementById('reconciliationSold').textContent=d&&raw!==''?(valid?`${sold} produk`:'Jumlah sisa tidak valid.'):'Pilih stok dan masukkan jumlah sisa.';document.getElementById('reconciliationAmount').textContent=money(sold*price);qtyInput.max=available};deliverySelect.addEventListener('change',updatePreview);qtyInput.addEventListener('input',updatePreview);document.getElementById('reconciliationForm').addEventListener('submit',async event=>{event.preventDefault();const d=ds.find(item=>String(item.id)===deliverySelect.value);const qty=Number(qtyInput.value);if(!d||!Number.isInteger(qty)||qty<0||qty>remainingQty(d)){toast('Jumlah retur atau sisa harus sesuai stok tersedia.');return}try{const result=await api('/reconciliations',{method:'POST',body:JSON.stringify({deliveryId:d.id,date:document.getElementById('reconciliationDate').value,qty})});await refreshState();toast(`Rekap tersimpan: ${result.sold} terjual · setoran ${money(result.amountDue)}.`);renderStock()}catch(error){toast(error.message)}})}
    function renderReports(){document.getElementById('app').classList.toggle('reports-as-partner',role!=='admin');const data=reportData();const deliveries=visibleDeliveries();const totalDue=deliveries.reduce((sum,d)=>sum+soldQty(d)*Number(d.unitSupplier||0),0);const sums=data.reduce((all,row)=>{for(const key of ['delivered','sold','returned','remaining','supplierRevenue','supplierCost','supplierProfit','partnerProfit','retailRevenue'])all[key]+=row[key];return all},{delivered:0,sold:0,returned:0,remaining:0,supplierRevenue:0,supplierCost:0,supplierProfit:0,partnerProfit:0,retailRevenue:0});document.getElementById('app').innerHTML=heading('REKAP & KEUANGAN','Laporan konsinyasi',role==='admin'?'Rekap stok, setoran, dan margin dari seluruh mitra.':`Rekap stok dan setoran untuk ${PARTNERS[role]||'mitra Anda'}.`)+`<div class="notice settlement-notice">Total uang yang harus diserahkan ke Kedai Primadona<div class="settlement-amount">${money(totalDue)}</div><div class="form-note">Jumlah produk terjual × harga setor per produk.</div></div><section class="panel"><div class="panel-head"><div><h2>Ringkasan periode</h2><p>Akumulasi seluruh data tersimpan</p></div><button class="btn btn-line btn-small" onclick="exportReport()">↓ Ekspor CSV</button></div><div class="summary-strip"><span>Masuk <strong>${sums.delivered}</strong></span><span>Terjual <strong>${sums.sold}</strong></span><span>Retur <strong>${sums.returned}</strong></span><span>Sisa <strong>${sums.remaining}</strong></span></div><div class="report-totals"><div class="report-total"><span>Omzet penjualan</span><strong>${money(sums.retailRevenue)}</strong></div><div class="report-total"><span>Laba suplier</span><strong>${money(sums.supplierProfit)}</strong></div><div class="report-total"><span>Laba koperasi</span><strong>${money(sums.partnerProfit)}</strong></div></div><div class="table-wrap">${data.length?`<table class="data-table settlement-table"><thead><tr><th>Produk</th><th>Masuk</th><th>Terjual</th><th>Retur</th><th>Sisa</th>${role==='admin'?'<th>Modal suplier</th><th>Penjualan suplier</th><th>Laba suplier</th><th>Laba mitra</th>':''}<th>Setoran ke Kedai Primadona</th></tr></thead><tbody>${data.map(row=>{const due=deliveries.filter(d=>d.productId===row.p.id).reduce((sum,d)=>sum+soldQty(d)*Number(d.unitSupplier||0),0);return`<tr><td>${escapeHtml(productLabel(row.p.id))}</td><td>${row.delivered}</td><td>${row.sold}</td><td>${row.returned}</td><td>${row.remaining}</td>${role==='admin'?`<td>${money(row.supplierCost)}</td><td>${money(row.supplierRevenue)}</td><td>${money(row.supplierProfit)}</td><td>${money(row.partnerProfit)}</td>`:''}<td>${money(due)}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty"><b>Belum ada data laporan</b>Rekap muncul setelah titipan dan penjualan dicatat.</div>'}</div></section>`;if(role==='admin')document.getElementById('app').innerHTML+=`<section class="panel section-gap"><div class="panel-head"><div><h2>Keuntungan per mitra</h2><p>Perhitungan berdasarkan produk terjual</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Mitra</th><th>Terjual</th><th>Omzet mitra</th><th>Laba suplier</th><th>Laba koperasi</th></tr></thead><tbody>${partnerReportData().map(row=>`<tr><td>${row.name}</td><td>${row.sold}</td><td>${money(row.revenue)}</td><td>${money(row.supplierProfit)}</td><td>${money(row.partnerProfit)}</td></tr>`).join('')}</tbody></table></div></section>`}
    function renderPartners(){document.getElementById('app').innerHTML=heading('PENGELOLAAN','Mitra', 'Tambah mitra baru beserta akun untuk mengakses area koperasi.')+`<section class="panel"><div class="panel-head"><div><h2>Tambah mitra</h2><p>Akun mitra dapat mencatat rekap penjualan dan retur sore.</p></div></div><div class="panel-body"><form id="partnerForm"><div class="form-grid"><div class="field"><label for="partnerName">Nama mitra</label><input id="partnerName" maxlength="80" required placeholder="Contoh: Koperasi Sekolah"></div><div class="field"><label for="partnerUsername">Username login</label><input id="partnerUsername" minlength="3" maxlength="30" pattern="[a-z0-9_-]+" required placeholder="koperasi_baru"><small>Huruf kecil, angka, garis bawah, atau tanda hubung.</small></div><div class="field full"><label for="partnerPassword">Kata sandi sementara</label><input id="partnerPassword" type="password" minlength="10" maxlength="1024" autocomplete="new-password" required><small>Minimal 10 karakter. Berikan kata sandi ini dengan aman kepada mitra.</small></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan mitra</button></div></form></div></section><section class="panel section-gap"><div class="panel-head"><div><h2>Mitra terdaftar</h2><p>${Object.keys(PARTNERS).length} mitra</p></div></div><div class="panel-body"><div class="partner-list">${Object.entries(PARTNERS).map(([id,name])=>`<div class="partner-row"><div class="partner-symbol">${escapeHtml(name.slice(0,2).toUpperCase())}</div><div><div class="partner-name">${name}</div><div class="partner-detail">Username: ${escapeHtml(id)}</div></div></div>`).join('')}</div></div></section>`;document.getElementById('partnerForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.currentTarget.querySelector('button[type="submit"]');button.disabled=true;try{await api('/partners',{method:'POST',body:JSON.stringify({name:document.getElementById('partnerName').value.trim(),username:document.getElementById('partnerUsername').value.trim(),password:document.getElementById('partnerPassword').value})});await refreshState();toast('Mitra dan akun berhasil ditambahkan.');renderPartners()}catch(error){toast(error.message);button.disabled=false}})}
    const partnerNavButton=document.createElement('button');partnerNavButton.dataset.page='partners';partnerNavButton.innerHTML='<span class="nav-icon">♧</span>Mitra';document.getElementById('navigation').append(partnerNavButton);
  </script>
</body>
</html>
