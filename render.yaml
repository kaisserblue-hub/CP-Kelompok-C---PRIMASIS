services:
  - type: web
    name: primasis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PRIMASIS_DB
        value: /tmp/primasis.db
      - key: PRIMASIS_SECRET_KEY
        generateValue: true
      - key: PRIMASIS_COOKIE_SECURE
        value: "1"
